[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghi-analysis"
version = "0.1.0"
description = "Analysis tools for gridded global horizontal irradiance data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.11,<2",
    "xarray>=2024.1,<2027",
    "dask[array]>=2024.1,<2027",
    "netCDF4>=1.6,<2",
    "pyproj>=3.6,<4",
    "matplotlib>=3.8,<4",
    "cartopy>=0.22,<0.26",
    "cmocean>=3.0,<4",
    "scikit-learn>=1.3,<2",
    "torch>=2.0,<3",
    "torchsom>=1.3,<2",
    "openelectricity>=0.11,<1",
    "geogif>=0.3,<1",
    "ultraplot>=1,<3",
]

[project.optional-dependencies]
experiments = ["wandb>=0.16,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*"]
